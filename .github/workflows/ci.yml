name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    uses: IsDerky/ci/.github/workflows/app-node.yml@v1
    with:
      gestor: pnpm
      pnpm: "10"
      lint: true
      typecheck: true
      env: NEXT_TELEMETRY_DISABLED=1

  docker:
    needs: check
    uses: IsDerky/ci/.github/workflows/imagen.yml@v1
